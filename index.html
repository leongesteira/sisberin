<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>SISBERIN</title>
</head>
<body>
    
    <header class="navbar">
        <div class="logo-area">
            <img src="img/Logo Berin.png" alt="Logo" class="logo">
            <span class="logo-text">sisberin</span>
        </div>

        <nav class="menu">
            <a href="#">Início</a>
            <a href="#">Dashboard</a>
            <a href="#">Relatórios</a>
            <a href="#">Configurações</a>
        </nav>

        <div class="user">
            <span>Usuário</span>
        </div>
    </header>

    <main class="container">
        <section class="sidebar">
            <ul>
                <li>Painel</li>
                <li>Calculadora</li>
                <li>Dados</li>
                <li>Config</li>
            </ul>
        </section>

        <section class="content">
            <h1>Bem-vindo ao SISBERIN</h1>
            <p>Sistema Beringelo - Controle e Gestçao Inteligente</p>

            <div class="cards">
                <div class="card">
                    <h3>Calculadora</h3>
                    <p>Acesse a calculadora do amor</p>
                    <button>Acessar</button>
                </div>
                <div class="card">
                    <h3>Configurações</h3>
                    <p>Gerencie o sistema</p>
                    <button>Acessar</button>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
